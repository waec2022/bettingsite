name: update

on:
  schedule:
    - cron: '0 5 * * *'  # Once daily 6am WAT = 1 request per day ONLY
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node generate.js

      - name: Copy to bettingsite
        run: |
          mkdir -p bettingsite
          cp data.json bettingsite/data.json
          echo "Copied"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bettingsite/data.json
          git diff --staged --quiet || (git commit -m "new 7 picks $(date -u +%F)" && git push)
