name: update

on:
  schedule:
    - cron: '0 */3 * * *'  # Every 3 hours = 8 requests/day = 240/month (free plan na 3000/month) - FOREVER SAFE
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node generate.js
          echo "--- TOTAL PICKS ---"
          cat data.json | grep -o '"match":' | wc -l
          echo "--- LAST UPDATED ---"
          cat data.json | grep lastUpdated

      - name: Copy to bettingsite
        run: |
          mkdir -p bettingsite
          [ -f data.json ] && cp data.json bettingsite/data.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bettingsite/data.json
          git diff --staged --quiet || (git commit -m "auto update ${{ github.run_id }}" && git push)
