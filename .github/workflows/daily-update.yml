name: update
on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 mins - so LIVE minute go update real
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run generate.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          node generate.js
          echo "--- Checking generated statuses ---"
          cat data.json | grep -o '"status":"[^"]*"' | sort | uniq -c
          cat data.json | grep -o '"statusLabel":"[^"]*"' | head -20
      
      - name: Copy to bettingsite
        run: |
          cp data.json bettingsite/data.json
          echo "Copied to bettingsite/data.json"
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bettingsite/data.json
          git diff --staged --quiet || git commit -m "Update real LIVE status - Upcoming Yellow, Live Red, Finished Green - $(date)"
          git push
