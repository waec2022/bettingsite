name: update

permissions:
  contents: write

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps if any
        run: |
          npm install || echo "no package.json - ok"

      - name: Run generate.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "Starting generate.js..."
          node generate.js
          echo ""
          echo "--- STATUS CHECK ---"
          cat data.json | grep -o '"status":"[^"]*"' | sort | uniq -c
          echo ""
          echo "--- SAMPLE LABELS ---"
          cat data.json | grep -o '"statusLabel":"[^"]*"' | head -20

      - name: Safe copy to bettingsite folder
        run: |
          mkdir -p bettingsite
          cp data.json bettingsite/data.json
          ls -lh data.json bettingsite/data.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bettingsite/data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto update: Upcoming Yellow, Live Red, Finished Green - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ Pushed"
          fi
