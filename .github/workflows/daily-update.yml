name: update

permissions:
  contents: write

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 mins AUTOMATIC - no need to press
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node generate.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p bettingsite
          cp data.json bettingsite/data.json 2>/dev/null || true
          git add data.json bettingsite/data.json
          git diff --staged --quiet || (git commit -m "auto update $(date -u)" && git push)
