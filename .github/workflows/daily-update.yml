name: daily-update
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Run generator
        run: |
          if [ -f "generate.js" ]; then node generate.js
          elif [ -f "bettingsite/generate.js" ]; then node bettingsite/generate.js
          else echo "No generate.js found" && ls -la && exit 1
          fi
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "auto: update predictions $(date +%Y-%m-%d)" && git push)
