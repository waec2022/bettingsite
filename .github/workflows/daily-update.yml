name: update

on:
  schedule:
    - cron: '*/20 * * * *'  # Every 20 mins = 72 req/day = safe for free plan
    # If you want 15 mins sharp, change to '*/15 * * * *' = 96 req/day (still ok with new code)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generate.js
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          echo "Starting generate.js with 24hrs limit protection..."
          node generate.js
          echo ""
          echo "--- STATUS CHECK ---"
          cat data.json | grep -o '"status":"[^"]*"' | sort | uniq -c
          echo ""
          echo "--- SAMPLE LABELS ---"
          cat data.json | grep -o '"statusLabel":"[^"]*"' | head -10

      - name: Safe copy to bettingsite folder
        run: |
          mkdir -p bettingsite
          if [ -f data.json ]; then
            cp data.json bettingsite/data.json
            echo "✅ Copied"
          else
            echo "❌ data.json not found - keeping old"
            exit 0
          fi

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json bettingsite/data.json || git add data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update 24hrs - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
