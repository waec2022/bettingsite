# Sure2OddToday automation Worker. Deploy with Cloudflare "Workers Builds" (import this GitHub repo, root directory: worker)
# or with `npx wrangler deploy` from this folder. Secrets are set in the Cloudflare dashboard, never in this file.
name = "sure2oddtoday-automation"
main = "src/index.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["*/15 * * * *"]      # one cheap tick every 15 minutes; the editor schedule decides what actually runs

[[kv_namespaces]]
binding = "S2O"
id = "fd0dc174894f4aa8a4a6ac3f2b2283e3"

[vars]
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-EDITOR-ORIGIN"   # e.g. https://sure2oddtoday.online (comma separate several)
GITHUB_BRANCH = "main"
DATA_PATH = "data.json"
